name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Fired by the personal-site deploy so new projects show up right away.
  repository_dispatch:
    types: [projects-updated]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update
      - name: Commit changes
        run: |
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh README"
          git push
